:root {
  color-scheme: light;
  --paper:#F5F0E7;
  --card:#FFFEFB;
  --navy:#192C43;
  --ink:#253448;

*{box-sizing:border-box}
html{min-height:100%}
body{

.opt input[type=radio]:checked{border:5px solid var(--gold-dark)}
.field{margin:0 0 17px}
.field label{
  display:block;font-size:11px;font-weight:750;letter-spacing:.065em;
  text-transform:uppercase;color:#536174;margin-bottom:8px;
}

.field-error{display:none;margin-top:7px;font-size:12px;color:#A12622}
.field-error.visible{display:block}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:24px}
.btn{

  color:var(--navy);font:650 13.5px/1.2 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  cursor:pointer;transition:background .2s,border-color .2s,transform .2s;
}
.btn:hover:not(:disabled){background:#F9F5EE;border-color:#C9B38E;transform:translateY(-1px)}
.btn:focus-visible{outline:2px solid var(--gold-dark);outline-offset:3px}
.btn.primary{

  color:white;margin-left:auto;min-width:146px;
  box-shadow:0 4px 10px rgba(25,44,67,.13);

.btn.primary:hover:not(:disabled){background:#29435F;border-color:#29435F}
.btn:disabled{cursor:wait;opacity:.88}
.btn-spinner{

  border:2px solid rgba(255,255,255,.35);border-top-color:#fff;

}
.btn-spinner[hidden],.submit-status[hidden]{display:none}

.submit-status{font:13px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#A12622;margin:10px 0 0;text-align:right}
.success{text-align:center;padding:22px 0}
.success h2{margin-bottom:12px}
.success p{color:var(--muted)}
.small{font-size:12px;color:var(--muted)}

  .opt{min-height:56px;padding:14px 13px}
  h2{margin-bottom:20px}
}
@media(prefers-reduced-motion:reduce){
  .step.active{animation:none}
  .btn-spinner{animation-duration:1.8s}
  .opt,.btn,.progress-bar span{transition:none}
