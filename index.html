<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nezávazná poptávka — Diplomová Dílna</title>
<style>
  :root{
    --paper:#F6F3EC;
    --paper-raised:#FFFDF9;
    --line:#DDD6C5;
    --ink:#1F2B3A;
    --ink-soft:#5B6472;
    --seal:#000000;
    --gold:#A9824C;
    --radius:4px;
    --serif:'Times New Roman', Times, serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:radial-gradient(circle at 1px 1px, rgba(31,43,58,0.05) 1px, transparent 0);
    background-size:22px 22px;
    color:var(--ink);
    font-family:var(--serif);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }
  .card{
    width:100%;
    max-width:520px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:0 1px 2px rgba(31,43,58,0.04), 0 12px 32px -16px rgba(31,43,58,0.18);
    padding:36px 38px 30px;
  }
  @media (max-width:480px){ .card{padding:26px 20px 22px;} }

  .logo-row{ display:flex; align-items:center; gap:10px; margin-bottom:22px; }
  .logo-mark{
    width:34px;height:34px; flex:none;
    border:1.5px solid var(--ink); border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-weight:700; font-size:13px;
  }
  .logo-word{ font-weight:700; font-size:18px; }
  .logo-word span{ color:var(--gold); }

  .header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .page-marker{ font-size:12px; letter-spacing:0.06em; color:var(--ink-soft); text-transform:uppercase; }
  .seal{
    width:32px;height:32px; border-radius:50%; flex:none;
    background:conic-gradient(var(--seal) calc(var(--pct,0) * 1%), transparent 0);
    display:flex;align-items:center;justify-content:center;
    transition:background 0.5s ease;
  }
  .seal::after{ content:""; width:22px;height:22px; border-radius:50%; background:var(--paper-raised); border:1px solid var(--line); }

  .rule{ height:1px; background:var(--line); margin-bottom:26px; }

  h1.brand{ font-size:14px; font-weight:700; letter-spacing:0.02em; color:var(--gold); margin:0 0 6px; text-transform:uppercase; }
  h2.step-title{ font-size:24px; font-weight:700; line-height:1.28; margin:0 0 8px; }
  p.step-sub{ font-size:14px; color:var(--ink-soft); margin:0 0 20px; }

  .step{ display:none; }
  .step.active{ display:block; animation:reveal 0.35s ease; }
  @keyframes reveal{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .option-list{ display:flex; flex-direction:column; gap:10px; margin-top:22px; margin-bottom:8px; }
  .option{ position:relative; }
  .option input{ position:absolute; opacity:0; inset:0; width:100%; height:100%; cursor:pointer; margin:0; }
  .option label{
    display:flex; align-items:center; gap:12px;
    border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; font-size:16px; cursor:pointer;
    background:var(--paper-raised);
    transition:border-color 0.15s ease, background 0.15s ease;
  }
  .option label::before{
    content:""; width:16px;height:16px; flex:none; border-radius:50%;
    border:1.5px solid var(--ink-soft);
    transition:border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .option input:checked + label{ border-color:var(--seal); background:#F2F2F2; }
  .option input:checked + label::before{ border-color:var(--seal); box-shadow:inset 0 0 0 3px var(--seal); }
  .option input:focus-visible + label{ outline:2px solid var(--seal); outline-offset:2px; }

  .field{ margin-bottom:16px; }
  .field label{
    display:block; font-size:12px; letter-spacing:0.03em; text-transform:uppercase;
    color:var(--ink-soft); margin-bottom:6px;
  }
  .field input, .field select{
    width:100%; font-family:var(--serif); font-size:16px; color:var(--ink);
    background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius);
    padding:11px 13px; transition:border-color 0.15s ease;
  }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--seal); }

  .nav-row{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:18px; }
  button{
    font-family:var(--serif); font-size:14px; letter-spacing:0.02em;
    border-radius:var(--radius); padding:13px 24px; cursor:pointer;
    border:1px solid transparent; transition:opacity 0.15s ease, background 0.15s ease;
  }
  .btn-primary{ background:var(--seal); color:#fff; border-color:var(--seal); margin-left:auto; }
  .btn-primary:hover{ opacity:0.85; }
  .btn-primary:disabled{ opacity:0.4; cursor:not-allowed; }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border-color:var(--line); }
  .btn-ghost:hover{ color:var(--ink); border-color:var(--ink-soft); }

  .success{ text-align:center; padding:10px 0 4px; }
  .success .seal-final{ width:54px;height:54px; border-radius:50%; background:var(--seal); margin:0 auto 18px; display:flex;align-items:center;justify-content:center; }
  .success .seal-final svg{ width:24px;height:24px; fill:#fff; }
  .success p{ color:var(--ink-soft); font-size:15px; line-height:1.6; }
</style>
</head>
<body>

<form class="card" id="dilnaForm" novalidate>

  <div class="logo-row">
    <div class="logo-mark">DD</div>
    <div class="logo-word">Diplomová<span>Dílna</span></div>
  </div>

  <div class="header">
    <span class="page-marker" id="pageMarker">Strana 1 z 5</span>
    <div class="seal" id="sealMeter" style="--pct:20"></div>
  </div>
  <div class="rule"></div>

  <!-- STEP 1 -->
  <div class="step active" data-step="1">
    <h1 class="brand">Nezávazná poptávka</h1>
    <h2 class="step-title">Jaký typ práce potřebujete?</h2>
    <div class="option-list" role="radiogroup" aria-label="Typ práce">
      <div class="option"><input type="radio" name="typPrace" id="opt1" value="Disertační práce"><label for="opt1">Disertační práce</label></div>
      <div class="option"><input type="radio" name="typPrace" id="opt2" value="Bakalářská práce"><label for="opt2">Bakalářská práce</label></div>
      <div class="option"><input type="radio" name="typPrace" id="opt3" value="Diplomová práce"><label for="opt3">Diplomová práce</label></div>
      <div class="option"><input type="radio" name="typPrace" id="opt4" value="Seminární práce"><label for="opt4">Seminární práce</label></div>
      <div class="option"><input type="radio" name="typPrace" id="opt5" value="Jiná práce"><label for="opt5">Jiná práce</label></div>
    </div>
  </div>

  <!-- STEP 2 -->
  <div class="step" data-step="2">
    <h2 class="step-title">S čím potřebujete pomoci?</h2>
    <div class="option-list" role="radiogroup" aria-label="Typ pomoci">
      <div class="option"><input type="radio" name="pomoc" id="p1" value="Vypracování celé práce"><label for="p1">Vypracování celé práce</label></div>
      <div class="option"><input type="radio" name="pomoc" id="p2" value="Úprava již napsaného textu"><label for="p2">Úprava již napsaného textu</label></div>
      <div class="option"><input type="radio" name="pomoc" id="p3" value="Korektura textu"><label for="p3">Korektura textu</label></div>
      <div class="option"><input type="radio" name="pomoc" id="p4" value="Formátování podle školy"><label for="p4">Formátování podle školy</label></div>
      <div class="option"><input type="radio" name="pomoc" id="p5" value="Konzultace"><label for="p5">Konzultace</label></div>
    </div>
    <div class="nav-row"><button type="button" class="btn-ghost" data-back>Zpět</button><span></span></div>
  </div>

  <!-- STEP 3 -->
  <div class="step" data-step="3">
    <h2 class="step-title">Termín odevzdání práce?</h2>
    <div class="option-list" role="radiogroup" aria-label="Termín">
      <div class="option"><input type="radio" name="termin" id="t1" value="Velmi urgentní"><label for="t1">🚨 Velmi urgentní</label></div>
      <div class="option"><input type="radio" name="termin" id="t2" value="Do 14 dnů"><label for="t2">Do 14 dnů</label></div>
      <div class="option"><input type="radio" name="termin" id="t3" value="Do 30 dnů"><label for="t3">Do 30 dnů</label></div>
      <div class="option"><input type="radio" name="termin" id="t4" value="Do 60 dnů"><label for="t4">Do 60 dnů</label></div>
    </div>
    <div class="nav-row"><button type="button" class="btn-ghost" data-back>Zpět</button><span></span></div>
  </div>

  <!-- STEP 4 -->
  <div class="step" data-step="4">
    <h2 class="step-title">Požadovaný rozsah práce</h2>
    <div class="option-list" role="radiogroup" aria-label="Rozsah práce">
      <div class="option"><input type="radio" name="rozsah" id="r1" value="do 20 stran"><label for="r1">do 20 stran</label></div>
      <div class="option"><input type="radio" name="rozsah" id="r2" value="40 stran"><label for="r2">40 stran</label></div>
      <div class="option"><input type="radio" name="rozsah" id="r3" value="40–60 stran"><label for="r3">40–60 stran</label></div>
      <div class="option"><input type="radio" name="rozsah" id="r4" value="80+ stran"><label for="r4">80+ stran</label></div>
      <div class="option"><input type="radio" name="rozsah" id="r5" value="ještě nevím"><label for="r5">ještě nevím</label></div>
    </div>
    <div class="nav-row"><button type="button" class="btn-ghost" data-back>Zpět</button><span></span></div>
  </div>

  <!-- STEP 5 -->
  <div class="step" data-step="5">
    <h2 class="step-title">Zadejte kontaktní údaje pro komunikaci</h2>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="vas@email.cz">
    </div>
    <div class="field">
      <label for="telefon">Telefon</label>
      <input type="tel" id="telefon" name="telefon" placeholder="+420 000 000 000">
    </div>
    <div class="field">
      <label for="jmeno">Jméno a příjmení</label>
      <input type="text" id="jmeno" name="jmeno" placeholder="Jan Novák">
    </div>
    <div class="field">
      <label for="kanal">Kam vám máme poslat nabídku?</label>
      <select id="kanal" name="kanal">
        <option value="WhatsApp">WhatsApp</option>
        <option value="Email">Email</option>
      </select>
    </div>
    <div class="nav-row">
      <button type="button" class="btn-ghost" data-back>Zpět</button>
      <button type="submit" class="btn-primary" id="submitBtn">Odeslat</button>
    </div>
  </div>

  <!-- SUCCESS -->
  <div class="step" data-step="6">
    <div class="success">
      <div class="seal-final"><svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 20.6 7.4l-1.4-1.4z"/></svg></div>
      <h2 class="step-title">Poptávka odeslána</h2>
      <p>Děkujeme! Ozveme se vám, jakmile to půjde.</p>
    </div>
  </div>

</form>

<script>
(function(){
  // ⚠️ Vložte sem URL vašeho nasazeného Google Apps Script webu (končí na /exec)
  const ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbycp0InDUCD2EMBSdNxhg_RUeTqCTUhYtfzfbSJrKz9kS5YwdQkx5AiWXheADFaSbTm4Q/exec";

  const form = document.getElementById('dilnaForm');
  const steps = Array.from(form.querySelectorAll('.step'));
  const totalSteps = 5;
  const pageMarker = document.getElementById('pageMarker');
  const seal = document.getElementById('sealMeter');
  let current = 1;

  function showStep(n){
    steps.forEach(s => s.classList.toggle('active', Number(s.dataset.step) === n));
    if(n <= totalSteps){
      pageMarker.textContent = `Strana ${n} z ${totalSteps}`;
      seal.style.setProperty('--pct', Math.round((n/totalSteps)*100));
    }
    current = n;
  }

  form.querySelectorAll('[data-back]').forEach(btn=>{
    btn.addEventListener('click', ()=> showStep(current - 1));
  });

  // picking a radio answer auto-advances — nothing is required, so no validation gate
  form.querySelectorAll('input[type="radio"]').forEach(input=>{
    input.addEventListener('change', ()=>{
      const stepNum = Number(input.closest('.step').dataset.step);
      setTimeout(()=> showStep(stepNum + 1), 250);
    });
  });

  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Odesílám…';

    const payload = Object.fromEntries(new FormData(form).entries());
    payload.odeslano = new Date().toISOString();

    try{
      await fetch(ENDPOINT_URL, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify(payload)
      });
      showStep(6);
    }catch(err){
      submitBtn.disabled = false;
      submitBtn.textContent = 'Odeslat';
      alert('Něco se nepovedlo. Zkuste to prosím znovu.');
      console.error(err);
    }
  });

  showStep(1);
})();
</script>

</body>
</html>
