<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nezávazná poptávka — Diplomová Dílna</title><style>:root{--paper:#F6F3EC;--card:#FFFDF9;--line:#DDD6C5;--ink:#1F2B3A;--muted:#5B6472;--gold:#A9824C}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 14px;background:var(--paper);color:var(--ink);font-family:"Times New Roman",serif}.card{width:min(520px,100%);background:var(--card);border:1px solid var(--line);padding:34px;border-radius:6px;box-shadow:0 14px 34px #1f2b3a18}.logo{font-size:19px;font-weight:700;margin-bottom:22px}.logo span{color:var(--gold)}.progress{font-size:12px;color:var(--muted);text-transform:uppercase;margin-bottom:20px}.step{display:none}.step.active{display:block}h1{font-size:14px;color:var(--gold);text-transform:uppercase;margin:0 0 6px}h2{font-size:24px;margin:0 0 18px}.opts{display:grid;gap:9px}.opt{border:1px solid var(--line);padding:13px;border-radius:4px;cursor:pointer}.opt input{margin-right:9px}.field{margin:12px 0}.field label{display:block;font-size:11px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:4px;background:#fff}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.btn{padding:12px 20px;border-radius:4px;border:1px solid var(--line);background:#fff;cursor:pointer}.primary{background:#000;color:#fff;border-color:#000;margin-left:auto}.success{text-align:center;padding:18px 0}.small{font-size:12px;color:var(--muted)}@media(max-width:480px){.card{padding:24px 18px}}</style></head><body><form class="card" id="f"><div class="logo">Diplomová<span>Dílna</span></div><div class="progress" id="progress">Strana 1 z 5</div>
<div class="step active" data-step="1"><h1>Nezávazná poptávka</h1><h2>Jaký typ práce potřebujete?</h2><div class="opts"><label class="opt"><input type="radio" name="typPrace" value="Disertační práce">Disertační práce</label><label class="opt"><input type="radio" name="typPrace" value="Bakalářská práce">Bakalářská práce</label><label class="opt"><input type="radio" name="typPrace" value="Diplomová práce">Diplomová práce</label><label class="opt"><input type="radio" name="typPrace" value="Seminární práce">Seminární práce</label><label class="opt"><input type="radio" name="typPrace" value="Jiná práce">Jiná práce</label></div></div>
<div class="step" data-step="2"><h2>S čím potřebujete pomoci?</h2><div class="opts"><label class="opt"><input type="radio" name="pomoc" value="Vypracování celé práce">Vypracování celé práce</label><label class="opt"><input type="radio" name="pomoc" value="Úprava již napsaného textu">Úprava již napsaného textu</label><label class="opt"><input type="radio" name="pomoc" value="Korektura textu">Korektura textu</label><label class="opt"><input type="radio" name="pomoc" value="Formátování podle školy">Formátování podle školy</label><label class="opt"><input type="radio" name="pomoc" value="Konzultace">Konzultace</label></div><div class="nav"><button type="button" class="btn back">Zpět</button></div></div>
<div class="step" data-step="3"><h2>Termín odevzdání práce?</h2><div class="opts"><label class="opt"><input type="radio" name="termin" value="Velmi urgentní">🚨 Velmi urgentní</label><label class="opt"><input type="radio" name="termin" value="Do 14 dnů">Do 14 dnů</label><label class="opt"><input type="radio" name="termin" value="Do 30 dnů">Do 30 dnů</label><label class="opt"><input type="radio" name="termin" value="Do 60 dnů">Do 60 dnů</label></div><div class="nav"><button type="button" class="btn back">Zpět</button></div></div>
<div class="step" data-step="4"><h2>Požadovaný rozsah práce</h2><div class="opts"><label class="opt"><input type="radio" name="rozsah" value="do 20 stran">do 20 stran</label><label class="opt"><input type="radio" name="rozsah" value="40 stran">40 stran</label><label class="opt"><input type="radio" name="rozsah" value="40–60 stran">40–60 stran</label><label class="opt"><input type="radio" name="rozsah" value="80+ stran">80+ stran</label><label class="opt"><input type="radio" name="rozsah" value="ještě nevím">ještě nevím</label></div><div class="nav"><button type="button" class="btn back">Zpět</button></div></div>
<div class="step" data-step="5"><h2>Zadejte kontaktní údaje</h2><div class="field"><label>Email</label><input type="email" name="email"></div><div class="field"><label>Telefon</label><input type="tel" name="telefon"></div><div class="field"><label>Jméno a příjmení</label><input type="text" name="jmeno"></div><div class="field"><label>Kam vám máme poslat nabídku?</label><select name="kanal"><option>WhatsApp</option><option>Email</option></select></div><div class="nav"><button type="button" class="btn back">Zpět</button><button class="btn primary" id="send">Odeslat</button></div></div>
<div class="step" data-step="6"><div class="success"><h2>Děkujeme!</h2><p>Vaše poptávka byla úspěšně odeslána.</p><p class="small">Brzy se vám ozveme.</p></div></div></form><script>(()=>{window.dataLayer=window.dataLayer||[];const f=document.getElementById('f'),steps=[...document.querySelectorAll('.step')],p=document.getElementById('progress');let cur=1,formStarted=false;function pushEvent(event,data={}){window.dataLayer.push({event,...data})}function show(n){steps.forEach(x=>x.classList.toggle('active',+x.dataset.step===n));cur=n;p.textContent=n<=5?`Strana ${n} z 5`:''}pushEvent('lead_form_view',{form_name:'nezavazna_poptavka'});document.querySelectorAll('input[type=radio],input[type=email],input[type=tel],input[type=text],select').forEach(x=>{x.addEventListener('change',()=>{if(!formStarted){formStarted=true;pushEvent('lead_form_start',{form_name:'nezavazna_poptavka'})}})});document.querySelectorAll('input[type=radio]').forEach(x=>x.onchange=()=>setTimeout(()=>show(+x.closest('.step').dataset.step+1),180));document.querySelectorAll('.back').forEach(b=>b.onclick=()=>show(cur-1));f.onsubmit=async e=>{e.preventDefault();const btn=document.getElementById('send');btn.disabled=true;btn.textContent='Odesílám…';const payload=Object.fromEntries(new FormData(f).entries()),u=new URLSearchParams(location.search);['utm_source','utm_medium','utm_campaign','utm_content','utm_term'].forEach(k=>{if(u.get(k))payload[k]=u.get(k)});payload.odeslano=new Date().toISOString();try{const r=await fetch('/.netlify/functions/submit-lead',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok)throw new Error(await r.text());pushEvent('lead_submit_success',{form_name:'nezavazna_poptavka',work_type:payload.typPrace||'',help_type:payload.pomoc||'',deadline:payload.termin||'',range:payload.rozsah||'',contact_channel:payload.kanal||''});show(6)}catch(err){console.error(err);alert('Něco se nepovedlo. Zkuste to prosím znovu.');btn.disabled=false;btn.textContent='Odeslat'}}})();</script></body></html>
